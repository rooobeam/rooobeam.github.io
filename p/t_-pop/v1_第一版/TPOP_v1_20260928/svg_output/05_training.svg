<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#10243A" stroke-width="2"/></marker></defs>
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="title" data-pptx-bounds="64 38 1152 109" fill="#10243A"><text x="64" y="62" font-size="16" fill="#5B6B7A">METHOD 2/3 · DATA → MODEL → LOSS</text><text x="64" y="120" font-size="44" font-weight="bold">RM training: pairs to a personal scorer</text></g>
<g id="training-pipeline" data-pptx-bounds="64 174 1152 203">
<line x1="279" y1="259" x2="325" y2="259" stroke="#10243A" stroke-width="2" marker-end="url(#arrow)"/><line x1="599" y1="259" x2="643" y2="259" stroke="#10243A" stroke-width="2" marker-end="url(#arrow)"/><line x1="919" y1="259" x2="965" y2="259" stroke="#10243A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="64" y="183" width="202" height="174" fill="#F3F6FA"/><text x="80" y="219" font-size="22" font-weight="bold" fill="#10243A">B pairs from history</text><text x="80" y="266" font-size="22" fill="#233447">[q, a₁] and [q, a₂]<tspan x="80" dy="39">2B complete texts</tspan></text><text x="80" y="340" font-size="22" fill="#5B6B7A">B preference labels</text>
<rect x="340" y="183" width="245" height="174" fill="#F3F6FA"/><text x="360" y="219" font-size="22" font-weight="bold" fill="#10243A">Frozen encoder</text><text x="360" y="262" font-size="22" fill="#233447">Qwen3-Embedding<tspan x="360" dy="30">0.6B · mean pooling</tspan></text><text x="360" y="339" font-size="22" fill="#10243A">E: (2B, 1024)</text>
<rect x="658" y="183" width="247" height="174" fill="#10243A"/><text x="678" y="219" font-size="22" font-weight="bold" fill="#FFFFFF">Trainable MLP θ</text><text x="678" y="264" font-size="22" fill="#FFFFFF">1024 → 1024 → 1<tspan x="678" dy="36">ReLU hidden layer</tspan></text><text x="678" y="339" font-size="22" fill="#FFFFFF">Rewards: (2B, 1)</text>
<rect x="981" y="183" width="235" height="174" fill="#E6F2F3"/><text x="1000" y="219" font-size="22" font-weight="bold" fill="#087F8C">Reshape by pair</text><text x="1000" y="272" fill="#10243A">R: (B, 2)</text><text x="1000" y="321" font-size="22" fill="#233447">Score per answer</text>
</g>
<g id="btl" data-pptx-replace-with="formula" data-pptx-x="64" data-pptx-y="398" data-pptx-width="483" data-pptx-height="70" data-pptx-bounds="64 398 483 70"><metadata type="application/json"><![CDATA[{"latex":"p_i=\\sigma(R_{i,1}-R_{i,2})","display":"block","font_size":28,"color":"#10243A","align":"left"}]]></metadata><text x="66" y="443" font-family="Cambria Math" fill="#10243A">pᵢ = σ(Rᵢ,₁ − Rᵢ,₂)</text></g>
<g id="probability-meaning" data-pptx-bounds="591 396 625 73" font-size="22" fill="#5B6B7A"><text x="593" y="422">pᵢ predicts that answer 1 is preferred.<tspan x="593" dy="34">ℓᵢ = 1 if the user chooses answer 1.</tspan></text></g>
<g id="bce" data-pptx-replace-with="formula" data-pptx-x="64" data-pptx-y="482" data-pptx-width="1152" data-pptx-height="93" data-pptx-bounds="64 482 1152 93"><metadata type="application/json"><![CDATA[{"latex":"\\mathcal L_t(\\theta)=-\\sum_{i=1}^{t}[\\ell_i\\log p_i+(1-\\ell_i)\\log(1-p_i)]+\\lambda\\|\\theta\\|_2^2","display":"block","font_size":28,"color":"#10243A","align":"left"}]]></metadata><text x="66" y="537" font-family="Cambria Math" fill="#10243A">Lₜ(θ) = −Σᵢ [ℓᵢ log pᵢ + (1 − ℓᵢ) log(1 − pᵢ)] + λ‖θ‖₂²</text></g>
<g id="training-boundary" data-pptx-bounds="64 590 1152 70" fill="#10243A"><text x="64" y="620"><tspan font-weight="bold">After full-answer feedback:</tspan> update θ using the accumulated history.</text><text x="64" y="650" font-size="22" fill="#5B6B7A">Only the MLP learns. Encoder and base LLM remain frozen.</text></g>
