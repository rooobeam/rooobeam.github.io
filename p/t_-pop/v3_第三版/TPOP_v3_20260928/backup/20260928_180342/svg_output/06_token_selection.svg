<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="28" data-pptx-page-role="content">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#10243A" stroke-width="2"/></marker></defs>
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="title" data-pptx-bounds="64 38 1152 109" fill="#10243A"><text x="64" y="62" font-size="16" fill="#5B6B7A">METHOD 3/3 · ALGORITHM 1, LINES 8–12</text><text x="64" y="120" font-size="44" font-weight="bold">Token selection: response 1, then response 2</text></g>
<g id="common-score" data-pptx-bounds="64 168 1152 96">
<rect x="64" y="168" width="1152" height="96" fill="#F3F6FA"/>
<text x="86" y="197" font-size="22" fill="#5B6B7A">Shared RM, separate prefixes · j = 1, 2</text>
<g id="score-definition" data-pptx-replace-with="formula" data-pptx-x="86" data-pptx-y="207" data-pptx-width="1110" data-pptx-height="51" data-pptx-bounds="86 207 1110 51"><metadata type="application/json"><![CDATA[{"latex":"\\mathrm{score}_j(v;\\theta_t)=\\pi_{\\rm base}(v\\mid y_{t,j})+\\omega r([y_{t,j},v];\\theta_t)","display":"block","font_size":28,"color":"#10243A","align":"left"}]]></metadata><text x="88" y="244" font-family="Cambria Math" fill="#10243A">scoreⱼ(v; θₜ) = πbase(v | yₜ,ⱼ) + ωr([yₜ,ⱼ, v]; θₜ)</text></g>
</g>
<g id="ordered-selection" data-pptx-bounds="64 286 1152 372">
<rect x="64" y="286" width="1152" height="115" fill="#E6F2F3"/>
<text x="86" y="323" font-size="22" font-weight="bold" fill="#087F8C">1. RESPONSE 1 · HIGHEST CURRENT SCORE</text>
<g id="first-token" data-pptx-replace-with="formula" data-pptx-x="86" data-pptx-y="339" data-pptx-width="1110" data-pptx-height="56" data-pptx-bounds="86 339 1110 56"><metadata type="application/json"><![CDATA[{"latex":"v_{p,1}=\\arg\\max_{v\\in\\mathcal V_p}\\mathrm{score}_1(v;\\theta_t)","display":"block","font_size":28,"color":"#10243A","align":"left"}]]></metadata><text x="88" y="378" font-family="Cambria Math" fill="#10243A">vₚ,₁ = argmaxᵥ∈𝒱ₚ score₁(v; θₜ)</text></g>
<line x1="1137" y1="402" x2="1137" y2="421" stroke="#10243A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="64" y="425" width="1152" height="233" fill="#FBEEE4"/>
<text x="86" y="463" font-size="22" font-weight="bold" fill="#C86620">2. RESPONSE 2 · SCORE + COMPARISON UNCERTAINTY</text>
<g id="second-token" data-pptx-replace-with="formula" data-pptx-x="86" data-pptx-y="479" data-pptx-width="1110" data-pptx-height="71" data-pptx-bounds="86 479 1110 71"><metadata type="application/json"><![CDATA[{"latex":"v_{p,2}=\\arg\\max_{v\\in\\mathcal V_p}\\left[\\mathrm{score}_2(v;\\theta_t)+\\omega\\nu\\|g(v)\\|_{V_{t-1}^{-1}}\\right]","display":"block","font_size":28,"color":"#10243A","align":"left"}]]></metadata><text x="88" y="522" font-family="Cambria Math" fill="#10243A">vₚ,₂ = argmaxᵥ∈𝒱ₚ [score₂(v; θₜ) + ων ‖g(v)‖V⁻¹ₜ₋₁]</text></g>
<g id="comparison-gradient" data-pptx-replace-with="formula" data-pptx-x="86" data-pptx-y="557" data-pptx-width="1110" data-pptx-height="60" data-pptx-bounds="86 557 1110 60"><metadata type="application/json"><![CDATA[{"latex":"g(v)=\\nabla_\\theta r([y_{t,2},v];\\theta_t)-\\nabla_\\theta r([y_{t,1},v_{p,1}];\\theta_t)","display":"block","font_size":28,"color":"#10243A","align":"left"}]]></metadata><text x="88" y="596" font-family="Cambria Math" fill="#10243A">g(v) = ∇θr([yₜ,₂, v]; θₜ) − ∇θr([yₜ,₁, vₚ,₁]; θₜ)</text></g>
<text x="86" y="647" font-size="22" fill="#087F8C">Fixed reference: response 1 with its already selected token vₚ,₁.</text>
</g>
