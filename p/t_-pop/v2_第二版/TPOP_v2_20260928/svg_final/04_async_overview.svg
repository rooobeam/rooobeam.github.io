<g id="title" data-pptx-bounds="64 38 1152 109" fill="#10243A"><text x="64" y="62" font-size="16" fill="#5B6B7A">METHOD 1/3 · SERVING, TRAINING, AND FINAL INFERENCE</text><text x="64" y="120" font-size="44" font-weight="bold">Serving and learning run asynchronously</text></g>
<g id="system-flow" data-pptx-bounds="64 157 1152 499">
<text x="64" y="183" font-size="22" font-weight="bold" fill="#10243A">ONLINE SERVING</text>
<text x="316" y="183" font-size="22" fill="#5B6B7A">Shared frozen LLM + latest ready RM; each branch keeps its own prefix.</text>
