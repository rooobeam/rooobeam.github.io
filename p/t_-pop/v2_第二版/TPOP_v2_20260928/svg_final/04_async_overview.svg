<line x1="711" y1="319" x2="778" y2="365" stroke="#10243A" stroke-width="2" marker-end="url(#arrow)" />
<path d="M 977 248 L 1005 248 L 1042 290" fill="none" stroke="#10243A" stroke-width="2" marker-end="url(#arrow)" />
<path d="M 977 365 L 1005 365 L 1042 326" fill="none" stroke="#10243A" stroke-width="2" marker-end="url(#arrow)" />
<path d="M 1131 346 L 1131 440 L 684 440 L 684 520" fill="none" stroke="#10243A" stroke-width="2" marker-end="url(#arrow)" />
<text x="797" y="430" font-size="22" fill="#5B6B7A">Full pair + preference</text>
<rect x="64" y="260" width="100" height="78" fill="#F3F6FA" />
<text font-size="22" fill="#10243A" text-anchor="middle" x="114" y="291">Query +</text><text font-size="22" fill="#10243A" text-anchor="middle" x="114" y="320">prefix</text><rect x="202" y="214" width="182" height="67" fill="#F3F6FA" />
<text x="293" y="243" text-anchor="middle" font-size="22" font-weight="bold" fill="#10243A">Frozen LLM</text>
<text x="293" y="268" text-anchor="middle" font-size="22" fill="#5B6B7A">candidates + π</text>
<rect x="202" y="331" width="182" height="67" fill="#10243A" />
<text x="293" y="360" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">Serving RM θₖ</text>
<text x="293" y="385" text-anchor="middle" font-size="22" fill="#FFFFFF">score each [s, v]</text>
<rect x="466" y="267" width="245" height="76" fill="#F3F6FA" />
<text x="588" y="299" text-anchor="middle" font-weight="bold" fill="#10243A">π(v) + ωr(v)</text>
<text x="588" y="329" text-anchor="middle" font-size="22" fill="#233447">Combined score</text>
<text x="491" y="376" font-size="22" fill="#5B6B7A">Repeat for each token</text>
<rect x="782" y="212" width="195" height="75" fill="#E6F2F3" />
<text x="879" y="242" text-anchor="middle" font-size="22" font-weight="bold" fill="#087F8C">Exploitation</text>
<text x="879" y="269" text-anchor="middle" font-size="22" fill="#233447">→ full answer a₁</text>
<rect x="782" y="317" width="195" height="92" fill="#FBEEE4" />
<text x="879" y="345" text-anchor="middle" font-size="22" font-weight="bold" fill="#C86620">Exploration</text>
<text x="879" y="373" text-anchor="middle" font-size="22" fill="#233447">+ uncertainty</text>
<text x="879" y="401" text-anchor="middle" font-size="22" fill="#233447">→ full answer a₂</text>
<rect x="1046" y="271" width="170" height="75" fill="#10243A" />
<text x="1131" y="304" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">User choice</text>
<text x="1131" y="333" text-anchor="middle" font-size="22" fill="#FFFFFF">one label ℓ</text>
<rect x="64" y="464" width="730" height="192" fill="#F3F6FA" />
<text x="87" y="495" font-size="22" font-weight="bold" fill="#10243A">BACKGROUND TRAINING · ASYNC</text>
<line x1="591" y1="557" x2="537" y2="557" stroke="#10243A" stroke-width="2" marker-end="url(#arrow)" />
<line x1="333" y1="557" x2="285" y2="557" stroke="#10243A" stroke-width="2" marker-end="url(#arrow)" />
<rect x="591" y="523" width="183" height="67" fill="#FFFFFF" />
<text x="682" y="551" text-anchor="middle" font-size="22" font-weight="bold" fill="#10243A">History</text>
<text x="682" y="579" text-anchor="middle" font-size="22" fill="#233447">(q, a₁, a₂, ℓ)</text>
<rect x="333" y="523" width="200" height="67" fill="#10243A" />
<text x="433" y="551" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">Train RM</text>
<text x="433" y="579" text-anchor="middle" font-size="22" fill="#FFFFFF">pairwise loss</text>
<rect x="96" y="523" width="185" height="67" fill="#E6F2F3" />
<text x="188" y="551" text-anchor="middle" font-size="22" font-weight="bold" fill="#087F8C">Ready RM θₖ₊₁</text>
<text x="188" y="579" text-anchor="middle" font-size="22" fill="#233447">publish update</text>
<path d="M 96 557 L 76 557 L 76 416 L 290 416 L 290 402" fill="none" stroke="#087F8C" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#update-arrow)" />
<text x="315" y="433" font-size="22" fill="#087F8C">Use when ready</text>
<text x="87" y="629" font-size="22" fill="#5B6B7A">During updates, new queries still use the current RM.</text>
<rect x="823" y="464" width="393" height="192" fill="#E6F2F3" />
<text x="843" y="495" font-size="22" font-weight="bold" fill="#087F8C">AFTER PERSONALIZATION</text>
<text x="843" y="542" font-size="22" fill="#10243A">Frozen LLM + frozen final RM</text>
<text x="843" y="584" font-size="22" font-weight="bold" fill="#10243A">Exploitation → one answer</text>
<text x="843" y="629" font-size="22" fill="#5B6B7A">No further preference updates.</text>
</g>
