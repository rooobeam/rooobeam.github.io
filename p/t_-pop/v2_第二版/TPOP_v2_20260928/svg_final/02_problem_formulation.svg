<text x="664" y="320" font-size="22" font-weight="bold" fill="#087F8C">OBSERVED FEEDBACK</text>
<text fill="#233447" x="664" y="366">A binary preference between</text><text fill="#233447" x="664" y="408">two complete answers to a query.</text><text x="664" y="448" font-size="22" fill="#5B6B7A">The user chooses A or B; no token labels.</text>
