<text x="86" y="532" font-size="22" font-weight="bold" fill="#087F8C">GOAL AND CONSTRAINTS</text>
<text x="86" y="579" fill="#10243A" font-weight="bold">Adapt answers to this user with few online comparisons.</text>
<text x="86" y="625" font-size="22" fill="#233447">Start without history · Keep the base LLM fixed · Limit the feedback burden</text>
