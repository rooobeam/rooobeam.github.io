<g id="main-insight" data-pptx-bounds="64 167 1152 105">
<text x="64" y="205" font-size="32" font-weight="bold" fill="#10243A">Learn a personal reward. Choose comparisons that improve it.</text>
<text x="64" y="254" fill="#233447">Data acquisition and generation form one loop, with the LLM frozen.</text>
