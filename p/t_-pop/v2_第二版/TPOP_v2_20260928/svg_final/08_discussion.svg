<g id="human-evidence" data-pptx-bounds="64 299 1152 75">
<text x="64" y="331" font-weight="bold" fill="#087F8C">Simulated users</text>
<text font-size="22" fill="#233447" x="359" y="326">Main feedback is simulated; cross-judge checks remain model-mediated.</text><text font-size="22" fill="#233447" x="359" y="359">Our next test: longitudinal studies with real users.</text></g>
<g id="prefix-transfer" data-pptx-bounds="64 395 1152 77">
<text x="64" y="427" font-weight="bold" fill="#10243A">Credit assignment</text>
<text font-size="22" fill="#233447" x="359" y="422">Training labels compare full answers; decoding scores partial prefixes.</text><text font-size="22" fill="#233447" x="359" y="455">Our next test: when does this supervision transfer reliably?</text></g>
<g id="compute-cost" data-pptx-bounds="64 491 1152 78">
<text x="64" y="523" font-weight="bold" fill="#C86620">Online compute</text>
<text font-size="22" fill="#233447" x="359" y="518">Reported query latency: 23.26 s (T-POP) vs. 11.25 s (AMULET).</text><text font-size="22" fill="#233447" x="359" y="551">Our next step: reduce the cost of repeated reward scoring.</text></g>
