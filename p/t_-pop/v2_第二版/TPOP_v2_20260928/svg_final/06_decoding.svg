<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="28" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" />
<g id="title" data-pptx-bounds="64 38 1152 109" fill="#10243A"><text x="64" y="62" font-size="16" fill="#5B6B7A">METHOD 3/3 · ONE COMPLETE DECODING STEP</text><text x="64" y="120" font-size="44" font-weight="bold">Two-arm decoding: score, explore, repeat</text></g>
<g id="candidates" data-pptx-replace-with="formula" data-pptx-x="64" data-pptx-y="167" data-pptx-width="1152" data-pptx-height="64" data-pptx-bounds="64 167 1152 64"><metadata type="application/json">{"latex":"\\mathcal C=\\operatorname{Top40}(\\pi_1)\\cup\\operatorname{Top40}(\\pi_2),\\quad |\\mathcal C|\\le80","display":"block","font_size":28,"color":"#10243A","align":"left"}</metadata><text x="66" y="209" font-family="Cambria Math" fill="#10243A">C = Top40(π₁) ∪ Top40(π₂),    |C| ≤ 80</text></g>
<g id="prefix-ownership" data-pptx-bounds="64 237 1152 39"><text x="64" y="263" font-size="22" fill="#5B6B7A">Each arm keeps its own prefix: rⱼ(v) = rθ([sⱼ, v]). Its probability and reward vectors have length C.</text></g>
<g id="policy-fields" data-pptx-bounds="64 289 1152 139"><rect x="64" y="289" width="554" height="139" fill="#E6F2F3" /><rect x="662" y="289" width="554" height="139" fill="#FBEEE4" /><text x="86" y="324" font-size="22" font-weight="bold" fill="#087F8C">1. EXPLOIT: MAXIMIZE THE CURRENT SCORE</text><text x="684" y="324" font-size="22" font-weight="bold" fill="#C86620">2. EXPLORE: ADD UNCERTAINTY</text>
<g id="exploit-policy" data-pptx-replace-with="formula" data-pptx-x="84" data-pptx-y="346" data-pptx-width="514" data-pptx-height="73" data-pptx-bounds="84 346 514 73"><metadata type="application/json">{"latex":"v_1^\\star=\\arg\\max_{v\\in\\mathcal C}[\\pi_1(v)+\\omega r_1(v)]","display":"block","font_size":28,"color":"#10243A","align":"left"}</metadata><text x="86" y="392" font-family="Cambria Math" fill="#10243A">v₁* = argmaxᵥ [π₁(v) + ωr₁(v)]</text></g>
<g id="explore-policy" data-pptx-replace-with="formula" data-pptx-x="682" data-pptx-y="346" data-pptx-width="514" data-pptx-height="73" data-pptx-bounds="682 346 514 73"><metadata type="application/json">{"latex":"v_2^\\star=\\arg\\max_{v\\in\\mathcal C}[\\pi_2(v)+\\omega r_2(v)+\\omega\\nu u(v)]","display":"block","font_size":24,"color":"#10243A","align":"left"}</metadata><text x="684" y="392" font-family="Cambria Math" font-size="24" fill="#10243A">v₂* = argmaxᵥ [π₂(v) + ωr₂(v) + ωνu(v)]</text></g>
</g>
<g id="uncertainty" data-pptx-replace-with="formula" data-pptx-x="64" data-pptx-y="445" data-pptx-width="385" data-pptx-height="64" data-pptx-bounds="64 445 385 64"><metadata type="application/json">{"latex":"u(v)=\\sqrt{z(v)^\\top V^{-1}z(v)}","display":"block","font_size":28,"color":"#10243A","align":"left"}</metadata><text x="66" y="485" font-family="Cambria Math" fill="#10243A">u(v) = √(z(v)ᵀ V⁻¹z(v))</text></g>
<g id="gradient-difference" data-pptx-replace-with="formula" data-pptx-x="472" data-pptx-y="445" data-pptx-width="744" data-pptx-height="64" data-pptx-bounds="472 445 744 64"><metadata type="application/json">{"latex":"z(v)=\\nabla_\\theta r_2(v)-\\nabla_\\theta r_1(v_1^\\star)\\in\\mathbb R^P","display":"block","font_size":26,"color":"#10243A","align":"left"}</metadata><text x="474" y="485" font-family="Cambria Math" font-size="26" fill="#10243A">z(v) = ∇θr₂(v) − ∇θr₁(v₁*) ∈ ℝᴾ</text></g>
<g id="uncertainty-meaning" data-pptx-bounds="64 515 1152 34"><text x="64" y="538" font-size="22" fill="#5B6B7A">P = RM parameter count. V tracks covered directions; the reference is the exploitation winner.</text></g>
<g id="state-update" data-pptx-replace-with="formula" data-pptx-x="64" data-pptx-y="555" data-pptx-width="544" data-pptx-height="63" data-pptx-bounds="64 555 544 63"><metadata type="application/json">{"latex":"V\\leftarrow V+\\delta\\delta^\\top,\\quad\\delta=z(v_2^\\star)","display":"block","font_size":28,"color":"#10243A","align":"left"}</metadata><text x="66" y="596" font-family="Cambria Math" fill="#10243A">V ← V + δδᵀ,    δ = z(v₂*)</text></g>
<g id="update-timing" data-pptx-bounds="638 555 578 63"><text font-size="22" fill="#10243A" x="640" y="579">Each token pair updates V, not θ.</text><text font-size="22" fill="#10243A" x="640" y="609">RM training waits for full-answer feedback.</text></g>
<g id="repeat" data-pptx-bounds="64 626 1152 33"><text x="64" y="650" font-size="22" font-weight="bold" fill="#10243A">Append one token per branch and repeat until the answer pair is complete.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 666 1152 29" font-size="16" fill="#5B6B7A"><text x="64" y="686">Eqs. (1), (4)–(6); Algorithm 1 · δ uses the opposite sign to the printed algorithm; δδᵀ is identical.</text><text x="1216" y="686" text-anchor="end">06 / 08</text></g>
</svg>